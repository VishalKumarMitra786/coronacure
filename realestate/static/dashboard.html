<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead Dashboard</title>
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1b;--card:#fff;--line:#e3e3df;--hot:#c2410c;--mut:#6b6b66}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#eee;--card:#202020;--line:#333;--mut:#999}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
h1{font-size:20px} .row{display:flex;gap:16px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr.lead{cursor:pointer} tr.lead:hover{background:rgba(128,128,128,.1)}
.badge{padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px}
.hot,.handoff{color:var(--hot);border-color:var(--hot)}
#chat{flex:1;min-width:280px;background:var(--card);border:1px solid var(--line);padding:12px;max-height:70vh;overflow:auto}
.m{margin:6px 0;padding:8px 10px;border-radius:10px;max-width:85%;white-space:pre-wrap}
.user{background:rgba(128,128,128,.18)} .assistant{background:rgba(37,150,90,.2);margin-left:auto}
.tbl{flex:3;min-width:320px;overflow:auto}
</style></head><body>
<h1>Leads <span id="count" style="color:var(--mut);font-weight:400"></span></h1>
<div class="row">
 <div class="tbl"><table><thead><tr><th>Score</th><th>Lead</th><th>Looking for</th><th>Timeline</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
 <div id="chat">Select a lead to read the conversation.</div>
</div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  const r = await fetch('/api/leads?token='+encodeURIComponent(token));
  if(!r.ok){document.body.innerHTML='Unauthorized. Open /dashboard?token=YOUR_TOKEN';return}
  const leads = await r.json();
  count.textContent = '('+leads.length+')';
  rows.innerHTML = leads.map(l => `<tr class="lead" data-id="${l.id}">
    <td><b>${l.score}</b></td>
    <td>${esc(l.name||'Unknown')}<br><small style="color:var(--mut)">${esc(l.phone)}${l.email?' · '+esc(l.email):''}</small></td>
    <td>${esc([l.intent,l.property_type,l.bedrooms&&l.bedrooms+' BHK',l.location,l.budget].filter(Boolean).join(' · '))}</td>
    <td>${esc(l.timeline||'')}</td>
    <td><span class="badge ${esc(l.status)}">${esc(l.status)}</span>${l.handoff_reason?'<br><small>'+esc(l.handoff_reason)+'</small>':''}</td></tr>`).join('');
}
rows.onclick = async e => {
  const tr = e.target.closest('tr.lead'); if(!tr) return;
  const r = await fetch(`/api/leads/${tr.dataset.id}/messages?token=`+encodeURIComponent(token));
  const ms = await r.json();
  chat.innerHTML = ms.map(m=>`<div class="m ${m.role}">${esc(m.content)}</div>`).join('');
  chat.scrollTop = chat.scrollHeight;
};
load(); setInterval(load, 15000);
</script></body></html>
